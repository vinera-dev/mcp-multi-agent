[project]
name = "mcp-multi-agent"
version = "0.1.0"
description = "MCP server and supervised multi-agent system for a fictional veterinary clinic"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.7",
    "langgraph>=1.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.setuptools.package-data]
mcp_multi_agent = ["data/faq/*.md"]
